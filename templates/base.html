{% load static icons %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141513">
  <title>{% block title %}Записали?{% endblock %}</title>
  {# favicon: Lucide circle-check (ISC) #}
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233fb67a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script>window.ICONS = "{% icon_sprite_url %}";</script>
</head>
<body>
  <main class="page {% block page_class %}{% endblock %}">
    {% if messages %}
      {% for message in messages %}<p class="alert" role="alert">{{ message }}</p>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
