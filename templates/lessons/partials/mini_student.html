{% load icons %}<template id="mini-student-tpl">
  <div class="mini mini-student">
    <div class="mini-top">
      <span class="mini-round">Раунд <b data-mini="round"></b></span>
      <span class="mini-countdown" data-mini="countdown" data-prefix="Таймер: " hidden>{% icon "timer" %}<span class="cd-text"></span></span>
      <button type="button" class="mini-icon" data-mini="expand" title="Развернуть" aria-label="Развернуть">{% icon "maximize-2" %}</button>
    </div>
    <p class="mini-auto mini-auto-line" data-mini="auto" data-prefix="Новый раунд через " role="status" hidden>{% icon "check-check" %}<span class="cd-text"></span></p>
    <p class="mini-error" data-mini="error" role="alert" hidden></p>
    <div class="mini-body">
      <button type="button" class="mini-mark" data-mini="mark">{% icon "check" %}<span data-mini="mark-label">Записал</span></button>
      <div class="mini-marked" data-mini="marked">
        <span class="mini-marked-label">{% icon "circle-check" %}Отмечено</span>
        <button type="button" class="mini-link" data-mini="unmark">Отменить</button>
      </div>
      <div class="mini-away" data-mini="away-box" hidden>
        <span class="mini-away-label">{% icon "door-open" %}Вы вышли</span>
        <button type="button" class="mini-back" data-mini="back">{% icon "log-in" %}<span data-mini="back-label">Я вернулся</span></button>
      </div>
    </div>
    {# вопрос открыт: место в очереди + «Разобрался»; «Записал» при этом работает #}
    <div class="mini-q-open" data-mini="q-open" role="status" hidden>
      <span class="mini-q-text">{% icon "hand" %}<span data-mini="q-text"></span></span>
      <button type="button" class="mini-link" data-mini="resolve">Разобрался</button>
    </div>
    <div class="mini-q-choice" data-mini="q-choice" hidden>
      <button type="button" class="mini-q-opt" data-mini="ask-question">{% icon "circle-help" %}Вопрос</button>
      <button type="button" class="mini-q-opt" data-mini="ask-bug">{% icon "bug" %}Ошибка</button>
    </div>
    {# «Внимание» агая: красный экран поверх всего окошка #}
    <div class="mini-attention" data-mini="attention" role="alertdialog" aria-label="Внимание" hidden>
      <p class="mini-attention-title">{% icon "triangle-alert" %}ВНИМАНИЕ</p>
      <p class="mini-attention-sub">Посмотрите на доску</p>
      <button type="button" class="mini-ack" data-mini="ack">{% icon "ear" %}<span data-mini="ack-label">Я слушаю</span></button>
    </div>
    <div class="mini-bottom" data-mini="bottom">
      <button type="button" class="mini-link mini-away-btn" data-mini="ask" aria-expanded="false">{% icon "hand" %}Вопрос</button>
      <button type="button" class="mini-link mini-away-btn" data-mini="away">{% icon "door-open" %}Я вышел</button>
    </div>
  </div>
</template>
